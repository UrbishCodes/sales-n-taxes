<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Counter sales: one bill, many items, reverse VAT. Works offline." />
  <title>Counter Sales</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Counter sales</h1>
      <p class="conn">One bill, many items · reverse VAT · works offline</p>
    </div>
    <button type="button" class="ghost" id="resetBtn">Reset</button>
  </header>

  <main class="layout">
    <div class="col">
      <section class="card" aria-labelledby="s1">
        <h2 id="s1"><span class="num">1</span> Bill total</h2>
        <label class="field">
          <span>Total paid, incl. VAT (NPR)</span>
          <input id="gross" type="number" inputmode="decimal" step="any" min="0" autocomplete="off" placeholder="e.g. 7500" />
        </label>
        <label class="field">
          <span>VAT %</span>
          <input id="vat" type="number" inputmode="decimal" step="any" min="0" value="13" autocomplete="off" />
        </label>
        <div class="ledger">
          <div><span>Taxable base</span><strong id="baseOut">—</strong></div>
          <div><span>VAT amount</span><strong id="vatOut">—</strong></div>
        </div>
        <p class="formula" id="formula"></p>
      </section>

      <section class="card" aria-labelledby="s2">
        <h2 id="s2"><span class="num">2</span> Items</h2>
        <p class="hint">Type the count or the rate. The other box follows, and the total stays the same. One line absorbs the rest.</p>
        <fieldset class="absorb-bill">
          <legend>Who absorbs the rest?</legend>
          <label class="absorb-pick">
            <input type="radio" name="absorber" value="none" id="absNone" />
            <span>Nobody, show the variance</span>
          </label>
        </fieldset>
        <div id="lines"></div>
        <button type="button" class="secondary" id="addLine">+ Add item</button>
      </section>
    </div>

    <div class="col">
      <section class="card" aria-labelledby="s3">
        <h2 id="s3"><span class="num">3</span> Result</h2>
        <div class="status" id="status" role="status">Enter the bill total.</div>
        <div id="resRows"></div>
        <div class="totals" id="totals"></div>
        <label class="field">
          <span>Billing lines (paste into invoice)</span>
          <textarea id="billing" rows="7" readonly aria-label="Billing lines"></textarea>
        </label>
        <button type="button" class="primary" id="copyBtn">Copy billing lines</button>
      </section>
    </div>
  </main>

  <template id="lineTpl">
    <article class="line">
      <div class="line-head">
        <label class="absorb-pick">
          <input type="radio" name="absorber" class="r-absorb" />
          <span>Absorbs the rest</span>
        </label>
        <button type="button" class="link b-remove">Remove</button>
      </div>

      <label class="field">
        <span>Item name</span>
        <input class="f-name" type="text" autocomplete="off" placeholder="e.g. Tab cover" />
      </label>

      <div class="field">
        <span>Unit sold</span>
        <div class="segmented" role="radiogroup" aria-label="Unit sold">
          <button type="button" role="radio" class="b-unit active" data-unit="pcs" aria-checked="true">Pcs</button>
          <button type="button" role="radio" class="b-unit" data-unit="doz" aria-checked="false">Dozen</button>
          <button type="button" role="radio" class="b-unit" data-unit="kg" aria-checked="false">Kg</button>
        </div>
      </div>

      <div class="fixed-row" hidden>
        <span class="fixed-label">Which box do you fix? The other one follows.</span>
        <div class="segmented" role="radiogroup" aria-label="Fixed box">
          <button type="button" role="radio" class="b-fix" data-fix="count" aria-checked="false">Count</button>
          <button type="button" role="radio" class="b-fix" data-fix="rate" aria-checked="true">Rate</button>
        </div>
      </div>

      <div class="two">
        <label class="field">
          <span class="l-count">Count (pcs)</span>
          <input class="f-count" type="number" inputmode="decimal" step="any" min="0" autocomplete="off" />
        </label>
        <label class="field">
          <span class="l-rate">Rate (NPR per pc)</span>
          <input class="f-rate" type="number" inputmode="decimal" step="any" min="0" autocomplete="off" />
        </label>
      </div>
      <button type="button" class="ghost-dark b-usemax" hidden>Use max rate again</button>
      <div class="stepper count-keys"></div>
      <div class="cands cands-list" hidden></div>

      <div class="two">
        <label class="field">
          <span class="l-std">Max rate (NPR per pc)</span>
          <input class="f-std" type="number" inputmode="decimal" step="any" min="0" autocomplete="off" />
        </label>
        <label class="field">
          <span>Buy cost (optional)</span>
          <input class="f-buy" type="number" inputmode="decimal" step="any" min="0" autocomplete="off" />
        </label>
      </div>

      <p class="line-msg"></p>
    </article>
  </template>

  <p class="toast" id="toast" role="status"></p>

  <script src="solver.js"></script>
  <script src="app.js"></script>
</body>
</html>
